<div class="app-shell d-flex page-content px-1">
    <div class="content flex-grow-1">
        <main class="px-4">
            <section class="row g-3 mb-4">
                <div class="col-6 col-md-3">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h6 class="mb-1">Total Customers</h6>
                                    <h3 class="mb-0">1,248</h3>
                                </div>
                                <div class="icon icon-lg bg-light rounded-circle">
                                    <i class="bi bi-people fs-4"></i>
                                </div>
                            </div>
                            <small class="text-success">+8.4% since last month</small>
                        </div>
                    </div>
                </div>

                <div class="col-6 col-md-3">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h6 class="mb-1">Active %</h6>
                                    <h3 class="mb-0">92%</h3>
                                </div>
                                <div class="icon icon-lg bg-light rounded-circle">
                                    <i class="bi bi-activity fs-4"></i>
                                </div>
                            </div>
                            <small class="text-success">Stable</small>
                        </div>
                    </div>
                </div>

                <div class="col-6 col-md-3">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h6 class="mb-1">Open Requests</h6>
                                    <h3 class="mb-0">14</h3>
                                </div>
                                <div class="icon icon-lg bg-light rounded-circle">
                                    <i class="bi bi-exclamation-triangle fs-4"></i>
                                </div>
                            </div>
                            <small class="text-warning">2 critical</small>
                        </div>
                    </div>
                </div>

                <div class="col-6 col-md-3">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h6 class="mb-1">Revenue</h6>
                                    <h3 class="mb-0">₹ 1.2M</h3>
                                </div>
                                <div class="icon icon-lg bg-light rounded-circle">
                                    <i class="bi bi-currency-rupee fs-4"></i>
                                </div>
                            </div>
                            <small class="text-success">+12% MoM</small>
                        </div>
                    </div>
                </div>
            </section>

            <!-- CHARTS & TABLE -->
            <section class="row g-3">
                <div class="col-lg-8">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="card-title mb-0">Customer Trend</h5>
                                <div class="text-muted small">Last 30 days</div>
                            </div>

                            <!-- ApexCharts line -->
                            <div id="chartOptions" style="height:320px;">
                                <apx-chart [series]="chartOptions.series" [chart]="chartOptions.chart" [dataLabels]="chartOptions.dataLabels"
                                    [plotOptions]="chartOptions.plotOptions" [responsive]="chartOptions.responsive" [xaxis]="chartOptions.xaxis"
                                    [legend]="chartOptions.legend" [fill]="chartOptions.fill"></apx-chart>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <h5 class="card-title">Category Breakdown</h5>

                            <!-- ApexCharts donut -->
                            <div id="pieChart" style="height:100%;">
                                <apx-chart [series]="donut.series" [chart]="donut.chart" [labels]="donut.labels"
                                    [plotOptions]="donut.plotOptions" [dataLabels]="donut.dataLabels"
                                    [legend]="donut.legend" [tooltip]="donut.tooltip" [colors]="donut.colors"
                                    style="width:100%; height:100%; display:block;"></apx-chart>
                            </div>
                        </div>
                    </div>
                </div>
