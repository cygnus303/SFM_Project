<div class="page-content">
    <div class="container-fluid bg-white  p-3">
        <div class="table-card">
            <table class="table table-bordered align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Meeting ID</th>
                        <th>Meeting date</th>
                        <th>Customer Name</th>
                        <th>Check In Time</th>
                        <th>Check Out Time</th>
                        <th>Meeting MOM</th>
                        <th>Remarks</th>
                        <th class="text-center">Action</th>
                    </tr>
                </thead>
                <tbody class="list form-check-all">
                    <tr *ngFor="let item of meetingList">
                        <td>
                            <a href="javascript:void(0)" class="text-danger fw-semibold text-decoration-underline">{{ item.meetingId }}</a>
                        </td>
                        <td>{{ item.meetingDate }}</td>
                        <td>{{ item.customerName }}</td>
                        <td>{{ item.checkIn }}</td>
                        <td>{{ item.checkOut }}</td>
                        <td style="max-width: 240px; min-width: 240px;">
                            <ng-select [items]="meetingMom" bindLabel="moM" bindValue="moM" placeholder="Search Mom" class="fixed-ng-select">
                                <ng-template ng-option-tmp let-item="item">
                                    <span [title]="item.moM">{{ item.moM }}</span>
                                </ng-template>
                            </ng-select>
                        </td>
                        <td>
                            <textarea rows="1" class="form-control form-control-sm" placeholder="Remarks"></textarea>
                        </td>
                        <td class="text-center">
                            <button class="btn btn-outline-dark btn-sm fw-semibold">
                                Submit
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
