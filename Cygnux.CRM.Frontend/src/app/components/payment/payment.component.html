<div class="page-content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-header border-0">
                        <div class="row g-4 align-items-center">
                            <div class="col-sm-auto ms-auto">
                                <div class="hstack gap-2">
                                    <button class="btn btn-info material-shadow-none"
                                        (click)="downloadSampleImport($event)">
                                        Download UTR Template
                                    </button>
                                    <button class="btn btn-info material-shadow-none"
                                        (click)="triggerFileInput($event)">
                                        Upload UTR Excel
                                    </button>
                                    <div class="file-upload">
                                        <input type="file" id="fileInput" (change)="onFileChange($event)"
                                            class="file" />
                                    </div>
                                    <button type="button" class="btn btn-success add-btn"  [disabled]="isdownloadLoading"
                                        (click)="downloadExcel($event)">
                                        <span *ngIf="isdownloadLoading" class="spinner-border spinner-border-sm"></span>
                                        <i *ngIf="!isdownloadLoading" class="bi bi-download"></i> Generate NEFT/RTGS
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div>
                            <div class="table-responsive table-card table-wrapper"
                                [ngClass]="{'show-table': showTable}">
                                <table class="table table-bordered align-middle w-100 position-table"
                                    id="customerTable">
                                    <thead class="table-light">
                                        <tr>
                                            <th class="text-center"></th>
                                            <th class="text-center">Payment ID</th>
                                            <th class="text-center">Amount</th>
                                            <th class="text-center">User ID</th>
                                            <th class="text-center">UTR No.</th>
                                            <th class="text-center">UTR Date</th>
                                        </tr>
                                    </thead>
                                    <tbody class="list form-check-all">
                                        <tr *ngFor="let payment of paymentList; let i = index">
                                            <th class="text-center"><input type="checkbox"
                                                    class="pure-checkbox text-center" [(ngModel)]="payment.selected">
                                            </th>
                                            <td class="text-center">{{payment.requestID}}</td>
                                            <td class="text-center">{{payment.approvedAmt}}</td>
                                            <td class="text-center">{{payment.createdBy}}</td>
                                            <td class="text-center">{{payment.utrNo}}</td>
                                            <td class="text-center">{{payment.utrDate}}</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <div *ngIf="loading && paymentList.length === 0" class="text-center border-found">
                                    <lord-icon src="/assets/json/system-solid-716-spinner-three-dots-loop-scale.json"
                                        trigger="loop" colors="primary:#121331,secondary:#08a88a"
                                        style="width: 100px; height: 100px">
                                    </lord-icon>
                                </div>
                                <div class="noresult" *ngIf="!loading && paymentList.length == 0">
                                    <div class="text-center">
                                        <img src="assets/images/noData.png" height="200" width="300">
                                        <h5 class="mt-2">Sorry! No Data Found</h5>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center m-3" *ngIf="paymentList.length != 0">
                        <button class="btn btn-square btn-primary pull-right" [disabled]="!hasSelection()" (click)="downloadSelectedUTR()">
                            <i class="bi bi-download"></i>
                            Download UTR Data
                        </button>
                        <!-- <div class="d-flex align-items-center gap-3">
                            <div>Showing Total Records : <strong>{{totalItems}}</strong></div>

                            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="pageSize"
                                [maxSize]="3" (pageChange)="onPageChange($event)">
                            </ngb-pagination>
                        </div> -->
                    </div>
                </div>
            <div>
        </div>
    </div>
</div>
</div>
