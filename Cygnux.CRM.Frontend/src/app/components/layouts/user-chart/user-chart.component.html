
<div class="page-content p-0">
  <div class="chart-container">
    <div class="row d-flex text-center pt-4">
      <!-- <div class="col-2">
        <label class="col-form-label">Date Range</label>
      </div>
      <div class="col-5">
        <input type="text" placeholder="Daterangepicker" class="form-control" bsDaterangepicker [(ngModel)]="dateRange"
          (bsValueChange)="onDateRangeSelected($event,userIdData)" [bsConfig]="{rangeInputFormat: 'DD.MM.YYYY', dateInputFormat:
                       'DD.MM.YYYY', ranges: ranges,containerClass: 'theme-dark-blue'}">
      </div> -->
      <div class="col-3">
            <div class="form-group mb-0 cursor-pointer" (click)="dp.toggle(); $event.stopPropagation()">
              <div class="input-group shadow-sm rounded"><span class="input-group-text bg-white border-end-0 p-2"><i
                    class="ri-calendar-fill text-dark text-secondary"></i></span>
               <input type="text" placeholder="Daterangepicker" class="form-control" #dp="bsDaterangepicker" bsDaterangepicker [(ngModel)]="dateRange"
          (bsValueChange)="onDateRangeSelected($event,userIdData)" [bsConfig]="{rangeInputFormat: 'DD.MM.YYYY', dateInputFormat:
                       'DD.MM.YYYY', ranges: ranges,containerClass: 'theme-dark-blue'}" [class.disabled-input]="true" >
              </div>
            </div>
          </div>
      <div class="col-1" *ngIf="chartList === 'complaint' && userType === 'MANAGER'">
        <label class="col-form-label">UserId:</label>
      </div>
      <div class="col-3" *ngIf="chartList === 'complaint' && userType === 'MANAGER'">
        <ng-select [items]="users" bindLabel="name" bindValue="name" [(ngModel)]="userIdData"
          (ngModelChange)="onDateRangeSelected(dateRange,userIdData)" placeholder="Search Attendees" [clearable]="true"
          [searchable]="true" [ngModelOptions]="{standalone: true}">
        </ng-select>
      </div>
    </div>                              
  <div class="pt-4 pb-0">
      <app-card-list [getfilter]="getLeadStatusfilter" (selectCardList)="exportLeadCategory($event)"></app-card-list>
    </div>
    <ng-container *ngIf="isCardLoading">
        <div class="d-flex flex-row flex-nowrap w-100 p-2 pe-0" style="overflow-x: auto;">
          <div class="fade-in" *ngFor="let item of placeholderArray" style="margin: 4px 8px;">
            <div class="card box-shadow border placeholder-card">
            <div class="card-body p-4 pt-3">
                <!-- Make lines full width inside card -->
                <div class="mb-2">
                  <div class="placeholder-line w-100 mb-1"></div>
                  <div class="placeholder-line w-100 mb-1"></div>
                </div>
                <div class="placeholder-line w-100 mb-1"></div>
                <div class="placeholder-line w-100 mb-1"></div>
                <div class="placeholder-line w-100 mb-1"></div>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
  <div class="pt-1 pb-4" *ngIf="chartList === 'meeting'">
    <div class="row pb-2 pt-2">
      <div class="col-lg-8">
        <div class="card game-card h-100 pt-3 ps-3">
          <h4>User Wise Meeting Count</h4>
          <!-- <canvas id="MyChart" class="canvas p-3">{{ charts }}</canvas> -->
          <div class="card-body">
            <canvasjs-chart *ngIf="meetingCanvasOptions" [options]="meetingCanvasOptions"
              style="width: 100%; height: 280px"></canvasjs-chart>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card game-card h-100">
          <div class="card-body d-grid justify-content-center">
            <h4>Meeting By Status</h4>
            <canvas id="MyPieChart" class="doughnut"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
  
    <div class="pt-1 pb-4" *ngIf="chartList === 'leads'">
      <section class="row pb-2 pt-2">
        <div class="col-lg-7">
          <div class="card game-card h-100">
            <div class="card-body">
              <h6>Leads By Stage</h6>
              <canvasjs-chart *ngIf="chartOptions" [options]="chartOptions"
                [styles]="{ width: '100%', height: '350px' }"></canvasjs-chart>
            </div>
          </div>
        </div>
      
        <div class="col-lg-5">
          <div class="card game-card h-100 ">
            <div class="card-body d-grid justify-content-center">
              <h6>Leads By Source</h6>
             <canvas id="MyPieChart" class="doughnut"></canvas>
            </div>
          </div>
        </div>
      </section>
      <!-- <div class="row">
        <div class="mb-5 col-lg-6">
          <h2>Leads By Stage</h2> 
          <canvasjs-chart [options]="chartOptions" [styles]="{width: '100%', height:'360px'}"></canvasjs-chart>
          </div>
        <div class="mt-3 col-lg-6 text-center d-grid justify-content-center">
          <h2>Leads By Source</h2>
          <canvas id="MyPieChart" class="doughnut"></canvas>
        </div>
      </div> -->
    </div>
  
    <div class="pt-0" *ngIf="chartList === 'complaint'">
      <div class="row pb-2 p-2">
        <div class="col-12">
          <div class="card game-card h-100">
            <div class="card-body">
              <h4>Day Wise Ticket Count</h4>
              <div class="chart-scroll-wrapper">
                 <div class="chart-inner">
                <canvasjs-chart *ngIf="complaintColumnOption" [options]="complaintColumnOption"
                style=" height: 280px"></canvasjs-chart>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12">
          <div class="row pb-2 pt-2">
            <div class="col-6">
             <div class="card game-card h-100">
              <div class="card-body d-grid justify-content-center">
                <h2>Tickets By Source</h2>
                <canvas id="MyPieChart" class="doughnut"></canvas>
              </div>
             </div>
            </div>
            <div class="col-6">
              <div class="card game-card h-100">
                <div class="card-body d-grid justify-content-center">
                  <h2>Rating</h2>
                  <canvas id="MyRatingChart" class="doughnut"></canvas>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
